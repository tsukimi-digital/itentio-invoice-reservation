name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itentio
          POSTGRES_PASSWORD: itentio
          POSTGRES_DB: itentio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itentio -d itentio"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Same single-node KRaft config as docker-compose.yml, so CI matches
      # local dev exactly. AppModule boots KafkaModule (Task 10) and
      # ReconciliationModule, so this is required for capacity.e2e-spec.ts
      # (and any other spec that loads the full AppModule) to bootstrap at
      # all — not just for Kafka-specific tests.
      kafka:
        image: apache/kafka:3.9.0
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: itentio-ci-cluster
        # Postgres had a health gate and Kafka did not, so readiness was down
        # to whether `npm ci` happened to take longer than broker startup.
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s --health-timeout 10s --health-retries 20
          --health-start-period 15s
    env:
      DATABASE_URL: postgresql://itentio:itentio@localhost:5432/itentio?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      KAFKA_BROKERS: localhost:9092
      KAFKA_CLIENT_ID: itentio-ci
      KAFKA_GROUP_ID: itentio-ci-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e
