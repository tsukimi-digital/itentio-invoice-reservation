name: itentio-invoice-reservation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itentio
      POSTGRES_PASSWORD: itentio
      POSTGRES_DB: itentio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U itentio -d itentio']
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode — no Zookeeper needed. Fine for local dev
  # and for this assignment; a real deployment would use a managed cluster.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: itentio-local-cluster
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # Kafka needs a named volume just as Postgres has one. Without it
    # `docker compose down` wipes the broker while the inbox table survives —
    # offsets restart at 0 against rows that still claim them, and that
    # asymmetry turns a redundant (topic, partition, offset) unique constraint
    # into a permanent consumer stall. See docs/DECISIONS.md ADR-05.
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:
  kafka-data:
